{% extends 'blog/base.html' %}
{% block content %}
<h2>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Post</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'post-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
